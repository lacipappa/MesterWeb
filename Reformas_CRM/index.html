ont-size:10px}.modal{position:fixed;inset:0;background:#0c1726aa;display:grid;place-items:center;padding:20px;z-index:10}.hidden{display:none}.modalbox{background:#fff;border-radius:16px;padding:26px;width:min(620px,100%);position:relative;max-height:85vh;overflow:auto}.close{position:absolute;right:15px;top:12px;border:0;background:none;font-size:28px;cursor:pointer}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{background:#f6f8fb;padding:12px;border-radius:9px}.detail small{display:block;color:var(--muted);margin-bottom:5px}@media(max-width:950px){.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.app{grid-template-columns:78px 1fr}.brand{font-size:0}.brand:before{content:'M';font-size:25px}.brand small,.nav span,.demo-note{display:none}.nav{text-align:center;font-size:18px}.photos{grid-template-columns:1fr 1fr}}@media(max-width:650px){.app{display:block}aside{position:fixed;z-index:9;width:245px;transform:translateX(-100%);transition:.2s}.app.open aside{transform:none}.nav span{display:inline}.brand{font-size:25px}.brand:before{display:none}.brand small,.demo-note{display:block}header{padding:0 15px;height:82px}#menu{display:block}.top input{display:none}#content{padding:18px 15px}.cards{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.metric{font-size:25px}.photos{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr}}

<div class="tablewrap"><table><thead><tr><th>Nº</th><th>Cliente</th><th>Trabajo</th><th>Importe</th><th>Estado</th></tr></thead><tbody>
${quotes.map((q,i)=>`<tr class="click" onclick="showQuote(${i})"><td><b>${q[0]}</b></td><td>${q[1]}</td><td>${q[2]}</td><td><b>${q[3]}</b></td><td>${pill(q[4])}</td></tr>`).join('')}
</tbody></table></div>`;
$('.filter').oninput=e=>{[...document.querySelectorAll('tbody tr')].forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'':'none')}
}

function showQuote(i){
const q=quotes[i],d=quoteDetails[i];
$('#modalContent').innerHTML=`<div class="quote-head"><div><div class="muted">PRESUPUESTO · DEMO</div><h2 style="margin:4px 0">${q[0]}</h2><div>${q[1]} · ${pill(q[4])}</div></div><div class="quote-total"><small class="muted">TOTAL CON IVA</small><strong>${d.total}</strong></div></div>
<div class="detailgrid"><div class="detail"><small>Cliente</small><b>${q[1]}</b></div><div class="detail"><small>Obra</small><b>${d.work}</b></div><div class="detail"><small>Fecha</small><b>${d.date}</b></div><div class="detail"><small>Válido hasta</small><b>${d.valid}</b></div></div>
<h3 style="margin:20px 0 8px">Partidas</h3><div class="quote-items-wrap"><table class="items"><thead><tr><th>Concepto</th><th>Cantidad</th><th>Precio</th><th>Importe</th></tr></thead><tbody>${d.items.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
<div class="totals"><div class="totalrow"><span>Base imponible</span><b>${d.base}</b></div><div class="totalrow"><span>IVA 21%</span><b>${d.iva}</b></div><div class="totalrow final"><span>Total</span><span>${d.total}</span></div></div>
<div class="mini-item" style="margin-top:16px"><b>Condiciones</b><div class="muted">Validez 30 días. Forma de pago y condiciones definitivas según acuerdo con el cliente. Datos ficticios para demostración.</div></div>
<div class="quote-actions"><button class="primary" onclick="demoQuoteAction('Enviar al cliente')">✉ Enviar</button><button class="printbtn" onclick="demoQuoteAction('Vista de impresión / PDF')">▤ Vista PDF</button><button class="printbtn" onclick="demoQuoteAction('Duplicar presupuesto')">⧉ Duplicar</button><button class="secondary" onclick="closeModal()">Cerrar</button></div>`;
$('#modal').classList.remove('hidden')
}
function demoQuoteAction(action){
$('#modalContent').innerHTML=`<h2>${action}</h2><p>En la aplicación final esta acción trabajaría con el presupuesto seleccionado.</p><p class="muted">En esta demo web no se envían mensajes ni se generan documentos reales.</p><button class="primary" onclick="closeModal()">Entendido</button>`;
}
function photos(){title.textContent='Fotos de obras';const imgs=[
['https://images.unsplash.com/photo-1768321902156-9358b5373d0a?auto=format&fit=crop&w=1200&q=82','Reforma interior'],
['https://images.unsplash.com/photo-1741121647933-10714e7b13d3?auto=format&fit=crop&w=1200&q=82','Estructura y obra'],
['https://images.unsplash.com/photo-1706670344501-0d1edc28193e?auto=format&fit=crop&w=1200&q=82','Baño terminado'],
['https://images.unsplash.com/photo-1779314687592-7d64bea77e8a?auto=format&fit=crop&w=1200&q=82','Cocina terminada'],
['https://images.unsplash.com/photo-1780849327888-cb6e5e6b9cc7?auto=format&fit=crop&w=1200&q=82','Reforma exterior'],
['https://images.unsplash.com/photo-1659031158304-5c0c54fb3592?auto=format&fit=crop&w=1200&q=82','Cocina en reforma']];content.innerHTML=`<div class="toolbar"><button class="primary" onclick="demoAdd('Foto')">+ Añadir foto</button><a href="fuentes-imagenes.html" style="align-self:center;color:#1478ff;font-weight:700;text-decoration:none">Fuentes de imágenes →</a></div><div class="photos">${imgs.map((x,i)=>`<div class="photo" title="${x[1]}"><img src="${x[0]}" alt="${x[1]}" loading="lazy"></div>`).join('')}</div>`}
function agenda(){title.textContent='Agenda';let ev={23:'Visita · Guardamar',24:'Enviar presupuesto',25:'Inicio · Torrevieja',28:'Llamar cliente'};content.innerHTML=`<div class="panel"><h2>Septiembre 2026</h2><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${Array.from({length:35},(_,i)=>{let d=i-1;return `<div class="day">${d>0&&d<=30?`<b>${d}</b>${ev[d]?`<div class="event">${ev[d]}</div>`:''}`:''}</div>`}).join('')}</div></div>`}
function render(v){if(v==='dashboard')dashboard();if(v==='clientes')tableView('Clientes',['Cliente','Ciudad','Teléfono','Trabajo','Estado'],clients);if(v==='obras')worksView();if(v==='presupuestos')quotesView();if(v==='documentos')tableView('Documentos',['Archivo','Cliente','Tipo','Fecha'],docs);if(v==='fotos')photos();if(v==='agenda')agenda()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.view);document.querySelector('.app').classList.remove('open')});$('#menu').onclick=()=>document.querySelector('.app').classList.toggle('open');
$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){document.querySelector('[data-view="clientes"]').click();setTimeout(()=>{$('.filter').value=e.target.value;$('.filter').dispatchEvent(new Event('input'))},0)}};
function showDetail(type,i){
if(type==='Clientes'){showClient(i);return}
let r= type==='Obras'?works[i]:type==='Presupuestos'?quotes[i]:docs[i];
let labels=type==='Obras'?['Obra','Ciudad','Trabajo','Progreso','Estado']:type==='Presupuestos'?['Número','Cliente','Trabajo','Importe','Estado']:['Archivo','Cliente','Tipo','Fecha'];
$('#modalContent').innerHTML=`<h2>${type} · Detalle</h2><p class="muted">Ficha demostrativa. Todos los datos son ficticios.</p><div class="detailgrid">${r.map((x,j)=>`<div class="detail"><small>${labels[j]||'Dato'}</small><b>${x}</b></div>`).join('')}</div><div class="actionrow"><button class="secondary" onclick="closeModal()">Cerrar</button></div>`;$('#modal').classList.remove('hidden')}
function showClient(i){
const c=clients[i],m=clientMeta[i], relatedWorks=works.filter(w=>w[1]===c[1]||w[0].toLowerCase().includes(c[0].split(' ')[1].toLowerCase()));
const relatedQuotes=quotes.filter(q=>q[1]===c[0]); const relatedDocs=docs.filter(d=>d[1]===c[0]);
$('#modalContent').innerHTML=`<div class="client-head"><div class="client-avatar">${c[0].split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><h2 style="margin:0">${c[0]}</h2><div class="muted">${c[1]} · ${pill(c[4])}</div></div></div>
<div class="detailgrid"><div class="detail"><small>Teléfono</small><b>${c[2]}</b></div><div class="detail"><small>Email</small><b>${m.email}</b></div><div class="detail"><small>Dirección</small><b>${m.address}</b></div><div class="detail"><small>Trabajo principal</small><b>${c[3]}</b></div></div>
<div class="tabs"><button class="tabbtn active" onclick="clientTab(${i},'resumen',this)">Resumen</button><button class="tabbtn" onclick="clientTab(${i},'obras',this)">Obras</button><button class="tabbtn" onclick="clientTab(${i},'presupuestos',this)">Presupuestos</button><button class="tabbtn" onclick="clientTab(${i},'documentos',this)">Documentos</button><button class="tabbtn" onclick="clientTab(${i},'pagos',this)">Pagos</button></div><div id="clientTab"></div>
<div class="actionrow"><button class="primary" onclick="demoAdd('Nota para ${c[0]}')">+ Añadir nota</button><button class="secondary" onclick="closeModal()">Cerrar</button></div>`;
clientTab(i,'resumen');$('#modal').classList.remove('hidden')}
function clientTab(i,tab,btn){
document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');
const c=clients[i],m=clientMeta[i], box=$('#clientTab');if(!box)return;
const rw=works.filter(w=>w[1]===c[1]||w[0].toLowerCase().includes(c[0].split(' ')[1].toLowerCase()));
const rq=quotes.filter(q=>q[1]===c[0]); const rd=docs.filter(d=>d[1]===c[0]);
if(tab==='resumen')box.innerHTML=`<div class="mini-list"><div class="mini-item"><b>Próxima tarea</b><div class="muted">${m.next}</div></div><div class="mini-item"><b>Notas</b><div class="muted">${m.note}</div></div></div>`;
if(tab==='obras')box.innerHTML=rw.length?`<div class="mini-list">${rw.map(w=>`<div class="mini-item"><b>${w[0]}</b><div class="muted">${w[2]} · ${w[3]}% · ${w[4]}</div><div class="bar"><i style="width:${w[3]}%"></i></div></div>`).join('')}</div>`:'<p class="muted">No hay obras asociadas.</p>';
if(tab==='presupuestos')box.innerHTML=rq.length?`<div class="mini-list">${rq.map(q=>`<div class="mini-item"><b>${q[0]} · ${q[3]}</b><div class="muted">${q[2]} · ${q[4]}</div></div>`).join('')}</div>`:'<p class="muted">No hay presupuestos asociados.</p>';
if(tab==='documentos')box.innerHTML=rd.length?`<div class="mini-list">${rd.map(d=>`<div class="mini-item"><b>📄 ${d[0]}</b><div class="muted">${d[2]} · ${d[3]}</div></div>`).join('')}</div>`:'<p class="muted">No hay documentos asociados.</p>';
if(tab==='pagos')box.innerHTML=`<div class="paybox"><div class="detail"><small>Pagado</small><b>${m.paid}</b></div><div class="detail"><small>Pendiente</small><b>${m.pending}</b></div><div class="detail"><small>Estado</small><b>${m.pending==='0 €'?'Pagado':'En seguimiento'}</b></div></div>`;
}
function demoAdd(type){$('#modalContent').innerHTML=`<h2>Nuevo · ${type}</h2><p>En la versión final, desde aquí se podría crear un nuevo registro y guardarlo en la base de datos local.</p><p class="muted">Esta versión web es una demostración visual y no almacena datos reales.</p><button class="primary" onclick="closeModal()">Entendido</button>`;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}window.closeModal=closeModal;window.showDetail=showDetail;window.showClient=showClient;window.clientTab=clientTab;window.showProject=showProject;window.projectTab=projectTab;window.showQuote=showQuote;window.demoQuoteAction=demoQuoteAction;window.demoAdd=demoAdd;render('dashboard');

</script></body></html>
