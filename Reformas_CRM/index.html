<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MesterCRM Reformas — Demo</title><style>
:root{--navy:#10233f;--blue:#1478ff;--bg:#f4f7fb;--text:#182337;--muted:#6f7b8c;--line:#e4eaf2;--green:#1da56f;--orange:#f49a38;--red:#e35c61}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}aside{background:var(--navy);color:white;padding:28px 16px;position:sticky;top:0;height:100vh}.brand{font-size:25px;font-weight:800;padding:0 12px 30px}.brand span{color:#55a6ff}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#a8b8cf;margin-top:4px}.nav{width:100%;border:0;background:transparent;color:#bdc9d9;text-align:left;padding:13px 15px;border-radius:10px;margin:3px 0;cursor:pointer;font-weight:700}.nav:hover,.nav.active{background:#1b365d;color:#fff}.demo-note{position:absolute;bottom:24px;left:28px;color:#8295ad;font-size:12px;line-height:1.5}main{min-width:0}header{height:92px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:18px}header h1{margin:0;font-size:25px}header p{margin:4px 0 0;color:var(--muted);font-size:13px}.top{margin-left:auto;display:flex;align-items:center;gap:14px}.top input{width:240px;padding:11px 14px;border:1px solid var(--line);border-radius:9px}.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:800}#menu{display:none;border:0;background:none;font-size:22px}#content{padding:28px 32px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px #20304a0a}.card{padding:20px}.metric{font-size:30px;font-weight:800;margin-top:10px}.muted{color:var(--muted);font-size:13px}.delta{font-size:12px;color:var(--green);margin-top:8px}.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:18px}.panel{padding:20px}.panel h2{font-size:17px;margin:0 0 16px}.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.grow{flex:1}.strong{font-weight:750}.pill{font-size:11px;font-weight:750;padding:5px 8px;border-radius:99px;background:#e8f2ff;color:#176dd0}.pill.green{background:#e4f7ef;color:#14845c}.pill.orange{background:#fff0df;color:#b9690e}.pill.red{background:#fde9ea;color:#b63b41}.bar{height:7px;background:#edf1f6;border-radius:8px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--blue);border-radius:8px}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar input{flex:1;max-width:360px;padding:11px 13px;border:1px solid var(--line);border-radius:9px}.primary{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:15px 17px;border-bottom:1px solid var(--line);font-size:13px}th{background:#fafbfd;color:#68758a;font-size:11px;text-transform:uppercase;letter-spacing:.5px}tr.click{cursor:pointer}tr.click:hover{background:#f8fbff}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.photo{height:190px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(135deg,#c7d3df,#eef2f6)}.photo:nth-child(2n){background:linear-gradient(135deg,#dccab8,#f2e7dc)}.photo:after{content:'OBRA · DEMO';position:absolute;bottom:12px;left:12px;background:#10233fcc;color:#fff;padding:7px 9px;border-radius:7px;font-size:11px;font-weight:700}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:90px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:12px}.day b{display:block;margin-bottom:9px}.event{background:#e8f2ff;color:#176dd0;padding:5px;border-radius:5px;margin-top:4px;font-size:10px}.modal{position:fixed;inset:0;background:#0c1726aa;display:grid;place-items:center;padding:20px;z-index:10}.hidden{display:none}.modalbox{background:#fff;border-radius:16px;padding:26px;width:min(620px,100%);position:relative;max-height:85vh;overflow:auto}.close{position:absolute;right:15px;top:12px;border:0;background:none;font-size:28px;cursor:pointer}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{background:#f6f8fb;padding:12px;border-radius:9px}.detail small{display:block;color:var(--muted);margin-bottom:5px}@media(max-width:950px){.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.app{grid-template-columns:78px 1fr}.brand{font-size:0}.brand:before{content:'M';font-size:25px}.brand small,.nav span,.demo-note{display:none}.nav{text-align:center;font-size:18px}.photos{grid-template-columns:1fr 1fr}}@media(max-width:650px){.app{display:block}aside{position:fixed;z-index:9;width:245px;transform:translateX(-100%);transition:.2s}.app.open aside{transform:none}.nav span{display:inline}.brand{font-size:25px}.brand:before{display:none}.brand small,.demo-note{display:block}header{padding:0 15px;height:82px}#menu{display:block}.top input{display:none}#content{padding:18px 15px}.cards{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.metric{font-size:25px}.photos{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr}}


/* visual polish */
body{background:#f5f7fb} main{min-width:0} header{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5} .card,.panel,.tablewrap{box-shadow:0 8px 28px rgba(15,23,42,.06)} .nav{transition:.18s ease}.nav:hover{transform:translateX(3px)} .primary{box-shadow:0 5px 14px rgba(37,99,235,.18)} .click:hover{background:#f8fbff} @media(max-width:760px){header{padding:18px}.top{width:100%}.top input{width:100%}}
</style></head><body>
<div class="app"><aside id="side"><div class="brand">Mester<span>CRM</span><small>REFORMAS · DEMO INTERACTIVA</small></div><nav>
<button class="nav active" data-view="dashboard">▦ <span>Resumen</span></button><button class="nav" data-view="clientes">👥 <span>Clientes</span></button><button class="nav" data-view="obras">🏗 <span>Obras</span></button><button class="nav" data-view="presupuestos">€ <span>Presupuestos</span></button><button class="nav" data-view="documentos">▤ <span>Documentos</span></button><button class="nav" data-view="fotos">▣ <span>Fotos</span></button><button class="nav" data-view="agenda">▢ <span>Agenda</span></button></nav><div class="demo-note">Datos ficticios<br>para demostración</div></aside>
<main><header><button id="menu">☰</button><div><h1 id="title">Resumen</h1><p>Clientes, obras, presupuestos y documentos en un solo lugar</p></div><div class="top"><input id="globalSearch" placeholder="Buscar cliente, obra…"><div class="avatar">LM</div></div></header><section id="content"></section></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const clients=[['José Martínez','Torrevieja','+34 600 123 456','Baño completo','Activo'],['Ana López','Guardamar','+34 611 234 567','Cocina','Activo'],['Carlos Ruiz','Alicante','+34 622 345 678','Terraza','Seguimiento'],['María Sánchez','Santa Pola','+34 633 456 789','Pintura interior','Nuevo'],['David Moreno','Orihuela','+34 644 567 890','Reforma integral','Activo']];
const works=[['Casa Martínez','Torrevieja','Baño completo',72,'En curso'],['Piso López','Guardamar','Cocina',38,'En curso'],['Terraza Ruiz','Alicante','Terraza',90,'Casi terminado'],['Villa Moreno','Orihuela','Reforma integral',18,'Planificación']];
const quotes=[['P-2026-018','José Martínez','Baño completo','2.450 €','Aceptado'],['P-2026-019','Ana López','Cocina','4.980 €','Pendiente'],['P-2026-020','María Sánchez','Pintura','1.180 €','Enviado'],['P-2026-021','David Moreno','Reforma integral','18.750 €','Borrador']];
const docs=[['Presupuesto_P-2026-018.pdf','José Martínez','Presupuesto','18/09/2026'],['Contrato_Martinez.pdf','José Martínez','Contrato','19/09/2026'],['Factura_anticipo_Lopez.pdf','Ana López','Factura','20/09/2026'],['Plano_cocina.pdf','Ana López','Plano','20/09/2026']];
const $=s=>document.querySelector(s), content=$('#content'), title=$('#title');
function pill(s){let c=s.includes('Acept')||s.includes('Activo')||s.includes('terminado')?'green':s.includes('Pend')||s.includes('curso')?'orange':'';return `<span class="pill ${c}">${s}</span>`}
function dashboard(){title.textContent='Resumen';content.innerHTML=`<div class="cards"><div class="card"><div class="muted">CLIENTES ACTIVOS</div><div class="metric">12</div><div class="delta">+3 este mes</div></div><div class="card"><div class="muted">OBRAS EN CURSO</div><div class="metric">5</div><div class="delta">2 próximas a finalizar</div></div><div class="card"><div class="muted">PRESUPUESTOS ABIERTOS</div><div class="metric">3</div><div class="delta">8.610 € pendientes</div></div><div class="card"><div class="muted">PRÓXIMAS TAREAS</div><div class="metric">6</div><div class="delta">2 para hoy</div></div></div><div class="grid2"><div class="panel"><h2>Obras en curso</h2>${works.slice(0,3).map(w=>`<div class="row"><div class="grow"><div class="strong">${w[0]}</div><div class="muted">${w[1]} · ${w[2]}</div><div class="bar"><i style="width:${w[3]}%"></i></div></div><b>${w[3]}%</b></div>`).join('')}</div><div class="panel"><h2>Próximas tareas</h2><div class="row"><div class="grow"><b>09:30 · Llamar a José</b><div class="muted">Confirmar azulejos</div></div></div><div class="row"><div class="grow"><b>12:00 · Visita de obra</b><div class="muted">Guardamar</div></div></div><div class="row"><div class="grow"><b>17:00 · Enviar presupuesto</b><div class="muted">María Sánchez</div></div></div></div></div>`}
function tableView(name,heads,rows){title.textContent=name;content.innerHTML=`<div class="toolbar"><input class="filter" placeholder="Buscar en ${name.toLowerCase()}…"><button class="primary" onclick="demoAdd('${name}')">+ Nuevo</button></div><div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="click" onclick="showDetail('${name}',${i})">${r.map((x,j)=>`<td>${j===r.length-1&&['Clientes','Obras','Presupuestos'].includes(name)?pill(String(x)):x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;$('.filter').oninput=e=>{[...document.querySelectorAll('tbody tr')].forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'':'none')}}
function photos(){title.textContent='Fotos de obras';content.innerHTML=`<div class="toolbar"><button class="primary" onclick="demoAdd('Foto')">+ Añadir foto</button></div><div class="photos">${Array.from({length:6},(_,i)=>`<div class="photo" title="Foto de demostración ${i+1}"></div>`).join('')}</div>`}
function agenda(){title.textContent='Agenda';let ev={23:'Visita · Guardamar',24:'Enviar presupuesto',25:'Inicio · Torrevieja',28:'Llamar cliente'};content.innerHTML=`<div class="panel"><h2>Septiembre 2026</h2><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${Array.from({length:35},(_,i)=>{let d=i-1;return `<div class="day">${d>0&&d<=30?`<b>${d}</b>${ev[d]?`<div class="event">${ev[d]}</div>`:''}`:''}</div>`}).join('')}</div></div>`}
function render(v){if(v==='dashboard')dashboard();if(v==='clientes')tableView('Clientes',['Cliente','Ciudad','Teléfono','Trabajo','Estado'],clients);if(v==='obras')tableView('Obras',['Obra','Ciudad','Trabajo','Progreso','Estado'],works.map(w=>[w[0],w[1],w[2],w[3]+'%',w[4]]));if(v==='presupuestos')tableView('Presupuestos',['Nº','Cliente','Trabajo','Importe','Estado'],quotes);if(v==='documentos')tableView('Documentos',['Archivo','Cliente','Tipo','Fecha'],docs);if(v==='fotos')photos();if(v==='agenda')agenda()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.view);document.querySelector('.app').classList.remove('open')});$('#menu').onclick=()=>document.querySelector('.app').classList.toggle('open');
$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){document.querySelector('[data-view="clientes"]').click();setTimeout(()=>{$('.filter').value=e.target.value;$('.filter').dispatchEvent(new Event('input'))},0)}};
function showDetail(type,i){let r= type==='Clientes'?clients[i]:type==='Obras'?works[i]:type==='Presupuestos'?quotes[i]:docs[i];$('#modalContent').innerHTML=`<h2>${type} · Detalle</h2><p class="muted">Ficha demostrativa. Todos los datos son ficticios.</p><div class="detailgrid">${r.map((x,j)=>`<div class="detail"><small>Campo ${j+1}</small><b>${x}</b></div>`).join('')}</div><br><button class="primary" onclick="closeModal()">Cerrar</button>`;$('#modal').classList.remove('hidden')}
function demoAdd(type){$('#modalContent').innerHTML=`<h2>Nuevo · ${type}</h2><p>En la versión final, desde aquí se podría crear un nuevo registro y guardarlo en la base de datos local.</p><p class="muted">Esta versión web es una demostración visual y no almacena datos reales.</p><button class="primary" onclick="closeModal()">Entendido</button>`;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}window.closeModal=closeModal;window.showDetail=showDetail;window.demoAdd=demoAdd;render('dashboard');

</script></body></html>
