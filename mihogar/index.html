const originalTexts=new WeakMap();
function translatedText(es){
 if(currentLang==='es')return es;
 const d=I18N[currentLang]||{};
 if(d[es]!==undefined)return d[es];
 let out=es;
 Object.keys(d).sort((a,b)=>b.length-a.length).forEach(k=>{if(out.includes(k))out=out.split(k).join(d[k])});
 return out;
}
function translatePage(root=document.body){
 document.documentElement.lang=currentLang;
 document.title=currentLang==='hu'?'MiHogar Digital – Interaktív bemutató':currentLang==='en'?'MiHogar Digital – Interactive demo':'MiHogar Digital — Demo interactiva';
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let n;while(n=walker.nextNode()){if(['SCRIPT','STYLE'].includes(n.parentElement?.tagName))continue;if(!originalTexts.has(n))originalTexts.set(n,n.nodeValue);const original=originalTexts.get(n);const lead=original.match(/^\s*/)[0],tail=original.match(/\s*$/)[0],core=original.trim();n.nodeValue=core?lead+translatedText(core)+tail:original}
 root.querySelectorAll?.('[placeholder]').forEach(el=>{if(!el.dataset.esPlaceholder)el.dataset.esPlaceholder=el.placeholder;el.placeholder=translatedText(el.dataset.esPlaceholder)});
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===currentLang));
}
